    <p>How the Sun, oceans, and air team up to make weather, climate, and hurricanes (TEKS 8.10A, 8.10B, 8.10C)</p>
  </div>
  <div id="who"></div>
</header>
<div class="trackwrap"><nav id="track" aria-label="Quest stations"></nav></div>
<main id="view"></main>

<script>
/* ---------- Saving ---------- */
const dlReady = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
const KEY = 'stormEngineQuest.v1';
function fresh(){ return {name:'',period:'',current:'brief',done:{},q:{},notes:{},sort:{},sortFirst:null,belts:null,game:{rounds:{},boost:0,done:false},gameNote:'',final:{ans:{},submitted:false},cer:''}; }
function load(){ try{ const r = localStorage.getItem(KEY); if(r){ const d = JSON.parse(r); const f = fresh(); return Object.assign(f, d, {game:Object.assign(f.game, d.game||{}), final:Object.assign(f.final, d.final||{})}); } }catch(e){} return fresh(); }
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Stations ---------- */
const ORDER = ['brief','s1','s2','s3','s4','s5','game','final'];
const LABELS = {brief:'Briefing',s1:'Sun',s2:'Water & air',s3:'Weather or climate',s4:'Global winds',s5:'Hurricanes',game:'Storm Steer game',final:'Final challenge'};

const STATIONS = {
s1:{ n:1, teks:'8.10A', time:'15 minutes', title:'The Sun’s uneven heat',
 mission:'Figure out why some parts of Earth get more energy from the Sun than others, and why that difference gets the whole atmosphere moving.',
 read:`
 <p>Almost all the energy that drives weather starts in one place: the <dfn>Sun</dfn>. Sunlight travels to Earth, warms the land and the oceans, and the warm surface then heats the air above it.</p>
 <p>But Earth is a ball, not a flat plate. Near the <dfn>equator</dfn>, sunlight hits the ground almost straight on, so its energy is packed into a small area. Near the <dfn>poles</dfn>, sunlight hits at a low slant, so the same beam of energy gets spread across a much bigger area. Each square meter gets less.</p>
 <p>The result is <dfn>uneven heating</dfn>: the tropics stay hot and the poles stay cold. Earth’s air and water are always trying to even out that difference. Warm air and water move toward the poles, and cold air and water move toward the equator. That constant movement is what we feel as wind and see as weather.</p>
 <div class="callout"><strong>Keep in mind</strong>Earth’s tilt changes the Sun’s angle through the year. That’s why Texas summers (Sun high in the sky) are so much hotter than Texas winters (Sun lower).</div>`,
 lab:'sun',
 questions:[
  {q:'Why does the equator get more solar energy per square meter than the poles?', o:['The equator is much closer to the Sun','Sunlight strikes the equator more directly, so energy is packed into a smaller area','The equator has more clouds that trap sunlight','The poles reflect all sunlight back into space'], a:1, why:'The distance to the Sun is almost the same. What changes is the angle: direct rays concentrate energy, slanted rays spread it out.'},
  {q:'In the Sun angle lab, set the Sun to 30°. Compared to 90°, each square meter of ground gets about…', o:['Twice as much energy','The same energy','Half as much energy','No energy at all'], a:2, why:'At 30° the beam spreads over about twice the area, so each square meter gets about 50% of the energy.'},
  {q:'What does uneven heating of Earth’s surface cause?', o:['Air and water to move, creating wind and weather','Earth to rotate','The Moon’s phases','Earthquakes'], a:0, why:'Differences in temperature create differences in air pressure, and air moves from high pressure to low pressure. That moving air is wind.'}
 ],
 note:'In your own words, explain why the North Pole stays cold even though it gets sunlight in summer.'},

s2:{ n:2, teks:'8.10A', time:'15 minutes', title:'Water, air, and the heat handoff',
 mission:'Discover how the hydrosphere (Earth’s water) and the atmosphere (Earth’s air) pass the Sun’s energy back and forth.',
 read:`
 <p>The <dfn>hydrosphere</dfn> is all of Earth’s water: oceans, lakes, rivers, ice, and water vapor. The <dfn>atmosphere</dfn> is the layer of air around Earth. Together they move the Sun’s energy around the planet.</p>
 <p>Water heats up and cools down much more slowly than land. Scientists say water has a high <dfn>specific heat</dfn>. That’s why a beach’s sand burns your feet at noon while the water still feels cool, and why oceans stay warm long after summer ends. Oceans store huge amounts of heat and carry it with <dfn>ocean currents</dfn>.</p>
 <p>The Sun’s energy also causes <dfn>evaporation</dfn>, turning liquid water into water vapor. That vapor holds hidden energy. When the vapor rises, cools, and <dfn>condenses</dfn> into cloud droplets, it releases that energy as heat into the air. This released heat is called <dfn>latent heat</dfn>, and it is the fuel that powers thunderstorms and hurricanes.</p>
 <p>You can see land and water working together at the coast. During the day, land heats faster, warm air rises over it, and cooler air from the sea rushes in to take its place: a <dfn>sea breeze</dfn>. At night, land cools faster, and the pattern flips into a <dfn>land breeze</dfn>.</p>
 <div class="callout"><strong>Texas connection</strong>Coastal cities like Corpus Christi and Galveston often get a cooling afternoon sea breeze in summer, and their temperatures swing less from day to night than inland cities.</div>`,
 lab:'breeze',
 questions:[
  {q:'On a sunny afternoon at a Texas beach, which way does the wind usually blow near the ground?', o:['From the land toward the sea','From the sea toward the land','Straight down from the sky','There is no wind during the day'], a:1, why:'The land heats faster, air rises over it, and cooler air from over the water flows in. That’s a sea breeze.'},
  {q:'Why do coastal cities usually have milder temperatures than inland cities at the same latitude?', o:['Water heats and cools slowly, so it keeps nearby air from getting extremely hot or cold','Coastal cities are closer to the Sun','Salt in the air blocks sunlight','Inland cities have more people'], a:0, why:'Because of water’s high specific heat, large bodies of water moderate (even out) temperatures nearby.'},
  {q:'What happens when water vapor condenses into cloud droplets?', o:['It absorbs heat and cools the air','It releases heat energy into the atmosphere','It turns into ice immediately','Nothing happens to energy'], a:1, why:'Condensation releases latent heat. This is the energy that powers storms.'},
  {q:'Which of these is part of the hydrosphere?', o:['A sea breeze','Sunlight','An ocean current','Air pressure'], a:2, why:'Ocean currents are moving water, so they are part of the hydrosphere. The others belong to the atmosphere or come from the Sun.'}
 ],
 note:'Explain how a sea breeze forms. Use the words land, water, heats, and rises.'},

s3:{ n:3, teks:'8.10A', time:'15 minutes', title:'Weather or climate?',
 mission:'Learn to tell the difference between short-term weather and long-term climate, then sort real examples.',
 read:`
 <p><dfn>Weather</dfn> is what the atmosphere is doing in one place over a short time: hours or days. It includes temperature, humidity, precipitation (rain, sleet, snow, hail), wind, air pressure, and clouds. Weather can change in minutes when a front moves through.</p>
 <p><dfn>Climate</dfn> is the long-term pattern of weather in a region, usually averaged over 30 years or more. Climate tells you what to <em>expect</em>; weather tells you what you actually <em>get</em> today.</p>
 <p>A region’s climate depends on several factors: its <dfn>latitude</dfn> (how much direct sunlight it gets), how close it is to <dfn>large bodies of water</dfn>, its <dfn>elevation</dfn>, nearby <dfn>ocean currents</dfn>, and the <dfn>prevailing winds</dfn> that bring in moist or dry air.</p>
 <div class="callout"><strong>Texas connection</strong>Texas has more than one climate. Houston, near warm ocean water, is humid and rainy. El Paso, far inland and higher in elevation, has a dry desert climate. Same state, very different climates.</div>`,
 lab:'sort',
 questions:[
  {q:'Which statement describes climate?', o:['It is raining in Dallas right now','Houston averages about 50 inches of rain per year','A cold front will arrive tonight','Winds are gusting to 30 mph this afternoon'], a:1, why:'An average over many years is climate. The others describe conditions at one moment, which is weather.'},
  {q:'One January day in Dallas is the coldest in ten years. Does that single day tell you the climate has changed?', o:['Yes, one record day changes the climate','No, one day is weather; climate is based on decades of data','Yes, if the day is below freezing','No, because Dallas has no climate'], a:1, why:'Climate is a long-term average. A single day, even an extreme one, is weather.'},
  {q:'Why is Houston’s climate more humid than El Paso’s?', o:['Houston is closer to a large body of warm ocean water that supplies moisture','Houston gets less sunlight','El Paso is closer to the equator','Houston has more mountains'], a:0, why:'Nearness to water is a major climate factor. Evaporation from warm ocean water puts moisture into the air that blows inland.'}
 ],
 note:'Describe today’s weather where you are. Then describe the climate of your part of Texas. How are your two answers different?'},

s4:{ n:4, teks:'8.10B', time:'20 minutes', title:'Global winds and the Coriolis effect',
 mission:'Map the giant wind belts that circle the planet and find out why Earth’s spin bends every wind and storm.',
 read:`
 <p>Remember uneven heating? At the equator, hot air <dfn>rises</dfn>, creating low pressure and lots of rain. High in the atmosphere, that air spreads toward the poles, cools, and <dfn>sinks</dfn> around 30° latitude, creating high pressure and dry air. Many of the world’s deserts sit near 30° for this reason. Then the air flows back toward the equator along the ground, completing a loop.</p>
 <p>These loops are called <dfn>convection cells</dfn>. Each hemisphere has three: the <dfn>Hadley cell</dfn> (0°–30°), the <dfn>Ferrel cell</dfn> (30°–60°), and the <dfn>Polar cell</dfn> (60°–90°). The surface winds they create are called <dfn>global winds</dfn>.</p>
 <p>If Earth didn’t spin, those winds would blow straight north or south. But Earth rotates, and the ground moves underneath the moving air. This makes winds, ocean currents, and storms appear to curve. That curving is the <dfn>Coriolis effect</dfn>. In the Northern Hemisphere, moving air curves to the <strong>right</strong>. In the Southern Hemisphere, it curves to the <strong>left</strong>. The effect is strongest near the poles and almost zero at the equator.</p>
 <p>Thanks to the Coriolis effect, the global winds blow at an angle: the <dfn>trade winds</dfn> blow from the east toward the equator (0°–30°), the <dfn>prevailing westerlies</dfn> blow from the west (30°–60°), and the <dfn>polar easterlies</dfn> blow from the east near the poles.</p>
 <div class="callout"><strong>Texas connection</strong>Texas sits in the zone where trade winds and westerlies meet. Most storm systems cross the United States from west to east, carried by the westerlies. Hurricanes in the tropics are pushed west by the trade winds, then often curve north as they reach the westerlies.</div>`,
 lab:'coriolis',
 questions:[
  {q:'In the Northern Hemisphere, the Coriolis effect makes moving air curve to the…', o:['Left','Right','Straight up','It doesn’t curve'], a:1, why:'Northern Hemisphere winds and currents deflect to the right. Southern Hemisphere ones deflect to the left.'},
  {q:'Most weather systems move across the United States from west to east because of the…', o:['Trade winds','Polar easterlies','Prevailing westerlies','Sea breeze'], a:2, why:'The United States sits mostly between 30° and 50° north, inside the belt of prevailing westerlies.'},
  {q:'Air sinks around 30° latitude, creating high pressure and dry conditions. This helps explain why many of the world’s ____ are found near 30°.', o:['rainforests','deserts','glaciers','volcanoes'], a:1, why:'Sinking air warms and dries out, so clouds and rain are rare. The Sahara and the Chihuahuan Desert are near 30°.'},
  {q:'Where is the Coriolis effect weakest?', o:['At the North Pole','At 45° latitude','At the equator','At the South Pole'], a:2, why:'The effect is near zero at the equator. That matters for hurricanes, as you’ll see next.'}
 ],
 note:'A storm forms over West Texas. Is it more likely to move toward Louisiana or toward New Mexico? Explain using a global wind belt.'},

s5:{ n:5, teks:'8.10C', time:'20 minutes', title:'The recipe for a hurricane',
 mission:'Identify the ingredients a tropical cyclone needs, follow how it grows, and explain why it dies.',
 read:`
 <p>A <dfn>tropical cyclone</dfn> is a huge, rotating, low-pressure storm that forms over warm tropical oceans. In the Atlantic and eastern Pacific it’s called a <dfn>hurricane</dfn>. In the western Pacific it’s a <dfn>typhoon</dfn>, and in the Indian Ocean it’s a <dfn>cyclone</dfn>. Same storm, different names.</p>
 <h3>The five ingredients</h3>
 <ul class="ingredients">
  <li><strong>Warm ocean water</strong>, at least about 26.5 °C (80 °F), deep enough to keep supplying heat.</li>
  <li><strong>Warm, moist air</strong> from evaporation, which carries energy upward.</li>
  <li><strong>Low wind shear</strong>: the wind speed and direction are similar from the bottom to the top of the storm, so it can stand up tall without being torn apart.</li>
  <li><strong>Enough Coriolis effect</strong> to start spinning, which means forming at least about 5° away from the equator.</li>
  <li><strong>A starting disturbance</strong>, like a cluster of thunderstorms. Many Atlantic hurricanes begin as tropical waves rolling off the coast of Africa.</li>
 </ul>
 <h3>How the engine runs</h3>
 <p>Warm, moist air rises from the ocean. As it rises it cools and condenses into towering clouds, releasing latent heat. That heat warms the storm’s core, which lowers the air pressure at the surface. Lower pressure pulls in more warm, moist air from the ocean… and the cycle feeds itself. Thanks to the Coriolis effect, the incoming air spins <strong>counterclockwise</strong> in the Northern Hemisphere.</p>
 <p>Storms grow in stages: <dfn>tropical disturbance</dfn> → <dfn>tropical depression</dfn> (winds under 39 mph) → <dfn>tropical storm</dfn> (39–73 mph, gets a name) → <dfn>hurricane</dfn> (74 mph or more). Hurricanes are rated Category 1–5 on the <dfn>Saffir-Simpson scale</dfn>; Category 3 and above (111 mph or more) are major hurricanes.</p>
 <p>A mature hurricane has a calm <dfn>eye</dfn> in the center, a ring of violent winds called the <dfn>eyewall</dfn>, and spiraling <dfn>rain bands</dfn>. When a hurricane moves over land or cold water, it loses its fuel supply and weakens. But it can still bring deadly <dfn>storm surge</dfn>, flooding rain, and tornadoes.</p>
 <div class="callout"><strong>Texas connection</strong>In 2017, Hurricane Harvey made landfall as a Category 4 hurricane near Rockport, then stalled over southeast Texas for days. Moisture kept streaming in from warm ocean water, and some places got more than 60 inches of rain. Atlantic hurricane season runs June 1 to November 30.</div>`,
 lab:'builder',
 questions:[
  {q:'Why do hurricanes weaken after they move over land?', o:['Land is closer to the Sun','They are cut off from the warm ocean water and moisture that fuel them','The Coriolis effect stops on land','Mountains reflect the wind back'], a:1, why:'No warm water means no evaporation and no latent heat. The engine runs out of fuel.'},
  {q:'Hurricanes almost never form within about 5° of the equator. Why?', o:['The water there is too cold','There is no sunlight there','The Coriolis effect is too weak to start the storm spinning','The trade winds stop there'], a:2, why:'Without enough Coriolis effect, incoming air flows straight into the low instead of spinning around it.'},
  {q:'What is the main energy source that powers a hurricane?', o:['Lightning inside the storm','Heat released when water vapor from the warm ocean condenses','Heat from inside Earth','Energy from the Moon’s tides'], a:1, why:'The Sun warms the ocean, water evaporates, and the vapor releases latent heat when it condenses in the storm’s clouds.'},
  {q:'A storm has sustained winds of 85 mph. What is it?', o:['A tropical depression','A tropical storm','A Category 1 hurricane','A Category 3 major hurricane'], a:2, why:'74–95 mph is Category 1. Major hurricanes start at 111 mph.'}
 ],

};

function unlocked(id){ const i = ORDER.indexOf(id); if(i<=0) return true; return !!S.done[ORDER[i-1]]; }
function go(id){ if(!unlocked(id)) return; S.current = id; save(); render(); window.scrollTo({top:0, behavior:'smooth'}); }

function renderTrack(){
  const nav = $('track');

  nav.innerHTML = `<svg viewBox="0 0 1000 150" preserveAspectRatio="none" aria-hidden="true"><path id="tpath" d="${d}" fill="none" stroke="var(--line)" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/></svg>`;
  const p = $('tpath'); const L = p.getTotalLength();
  ORDER.forEach((id, i) => {
    const pt = p.getPointAtLength(L * i / (ORDER.length - 1));
    const b = document.createElement('button');
    b.className = 'node' + (S.done[id] ? ' done' : '') + (S.current === id ? ' here' : '');
    b.style.left = (pt.x / 10) + '%'; b.style.top = (pt.y / 1.5) + '%';

    b.innerHTML = `${sym}<span class="tip">${LABELS[id]}</span>`;
    b.setAttribute('aria-label', `${LABELS[id]}${S.done[id] ? ', complete' : ''}${b.disabled ? ', locked' : ''}`);
    if(S.current === id) b.setAttribute('aria-current', 'step');
    b.onclick = () => go(id);
    nav.appendChild(b);
  });
}

function render(){
  renderWho(); renderTrack();
  const id = S.current;
  if(!unlocked(id)) { S.current = 'brief'; return render(); }
  if(id === 'brief') renderBrief();
  else if(id === 'game') renderGame();
  else if(id === 'final') renderFinal();
  else renderStation(id);
}

function renderStation(id){
  const st = STATIONS[id];
  S.q[id] = S.q[id] || {};
  const qs = st.questions.map((q, i) => `
    <fieldset class="q" id="q${i}"><legend>${i+1}. ${q.q}</legend>
      <div class="opts">${q.o.map((o, j) => `<button class="opt" data-q="${i}" data-o="${j}">${o}</button>`).join('')}</div>
      <p class="fb" aria-live="polite"></p>
    </fieldset>`).join('');
  $('view').innerHTML = `
  <article>
    <p class="meta">Station ${st.n} of 5, TEKS ${st.teks}, about ${st.time}</p>
    <h2>${st.title}</h2>
    <p class="mission">${st.mission}</p>
    <section class="read">${st.read}</section>
    <section class="lab" id="lab"></section>
    <section class="checks"><h3>Check your understanding</h3>${qs}</section>
    <section class="note"><h3>Field notes</h3>
      <label for="note">${st.note}</label>
      <textarea id="note">${esc(S.notes[id]||'')}</textarea>
      <div class="count" id="cnt"></div>
    </section>
    <div class="next"><button class="btn primary" id="finish">${st.n < 5 ? `Finish station and go to Station ${st.n+1}` : 'Finish station and unlock the game'}</button><p id="fmsg" aria-live="polite"></p></div>
  </article>`;
  LABS[st.lab]($('lab'));
  st.questions.forEach((q, i) => paintQ(id, i));
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(id, +b.dataset.q, +b.dataset.o));
  const note = $('note');
  const upd = () => { const n = note.value.trim().length; $('cnt').textContent = n < 40 ? `Write at least 40 characters (${n} so far).` : 'Looks good.'; };
  note.oninput = () => { S.notes[id] = note.value; save(); upd(); };
  upd();
  $('finish').onclick = () => {
    const missing = st.questions.filter((q, i) => !(S.q[id][i] && S.q[id][i].correct)).length;
    const extra = (st.lab === 'sort' && SORT_ITEMS.some((it, i) => !S.sort[i])) ? 'Finish sorting all 10 cards in the lab. ' : '';
    if(missing || (S.notes[id]||'').trim().length < 40 || extra){
      $('fmsg').textContent = extra + (missing ? `Answer ${missing} more question${missing>1?'s':''} correctly. ` : '') + ((S.notes[id]||'').trim().length < 40 ? 'Your field notes need at least 40 characters.' : '');
      return;
    }
    S.done[id] = true; save();
    go(ORDER[ORDER.indexOf(id)+1]);
  };
}
function answer(id, i, j){
  const rec = S.q[id][i] = S.q[id][i] || {tries:0, correct:false, wrong:[]};
  if(rec.correct) return;
  rec.tries++;
  if(j === STATIONS[id].questions[i].a) rec.correct = true; else if(!rec.wrong.includes(j)) rec.wrong.push(j);
  save(); paintQ(id, i);
}
function paintQ(id, i){
  const q = STATIONS[id].questions[i], rec = S.q[id][i], fs = $('q'+i), fb = fs.querySelector('.fb');
  if(!rec) return;
  fs.querySelectorAll('.opt').forEach(b => {
    const j = +b.dataset.o;
    b.classList.toggle('wrong', rec.wrong.includes(j));
    b.classList.toggle('right', rec.correct && j === q.a);
    b.disabled = rec.correct || rec.wrong.includes(j);
  });
  if(rec.correct){ fb.className = 'fb ok'; fb.textContent = `Correct${rec.tries===1?' on the first try':''}. ${q.why}`; }
  else { fb.className = 'fb no'; fb.textContent = 'Not quite. Reread the station text above and try another answer.'; }
}

      <g font-size="16" font-weight="700" fill="var(--storm)" text-anchor="middle"><text x="80" y="230">A</text><text x="210" y="230">B</text><text x="340" y="230">C</text></g>
    </svg>
    <div id="beltRows"></div>
    <div class="controls"><button class="btn primary" id="bCheck">Check my map</button><span id="bRes" class="tag" aria-live="polite"></span></div>
  </div>`;

  // Turntable
  const cv = $('cc'), ctx = cv.getContext('2d'), R = 280, C = 320;
  let ang = 0, spin = true, north = true, puck = null, trails = [], last = performance.now();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function rot(x, y, a){ return [x*Math.cos(a) - y*Math.sin(a), x*Math.sin(a) + y*Math.cos(a)]; }
  function frame(now){
    if(!cv.isConnected) return;
    const dt = Math.min(.05, (now - last)/1000); last = now;
    const w = spin ? (north ? .9 : -.9) * (reduce ? .6 : 1) : 0;
    ang += w*dt;
    if(puck){
      puck.t += dt; const r = 150*puck.t;
      const ix = 0, iy = r;
      puck.pos = [ix, iy];
      const [dx, dy] = rot(ix, iy, -ang); puck.trail.push([dx, dy]);
      if(r >= R){ trails.push(puck.trail); puck = null; explain(); }
    }
    const st = getComputedStyle(document.documentElement);
    ctx.clearRect(0,0,640,640);
    ctx.save(); ctx.translate(C, C);
    ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fillStyle = st.getPropertyValue('--card'); ctx.fill();
    ctx.strokeStyle = st.getPropertyValue('--line'); ctx.lineWidth = 2;
    for(let k=0;k<12;k++){ const [x,y] = rot(0,R,ang + k*Math.PI/6); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(x,-y); ctx.stroke(); }
    [90,180,R].forEach(rr => { ctx.beginPath(); ctx.arc(0,0,rr,0,Math.PI*2); ctx.stroke(); });
    ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.strokeStyle = st.getPropertyValue('--storm');
    const drawTrail = tr => { ctx.beginPath(); tr.forEach(([x,y],i) => { const [sx,sy] = rot(x,y,ang); i ? ctx.lineTo(sx,-sy) : ctx.moveTo(sx,-sy); }); ctx.stroke(); };
    trails.forEach(drawTrail); if(puck) drawTrail(puck.trail);
    if(puck){ ctx.beginPath(); ctx.arc(puck.pos[0], -puck.pos[1], 14, 0, Math.PI*2); ctx.fillStyle = st.getPropertyValue('--sun'); ctx.fill(); }
    ctx.fillStyle = st.getPropertyValue('--ink'); ctx.font = 'bold 26px Atkinson Hyperlegible, Verdana, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(north ? 'North Pole' : 'South Pole', 0, 40);
    ctx.font = '22px Atkinson Hyperlegible, Verdana, sans-serif'; ctx.fillText('toward equator ↑', 0, -R + 30);
    ctx.restore();
    requestAnimationFrame(frame);
  }
  function explain(){
    if(!spin) $('cTxt').textContent = 'With Earth not spinning, the mark is a straight line. No spin, no Coriolis effect.';
    else $('cTxt').textContent = north
      ? 'The puck flew straight, but the ground turned under it, so its path across Earth curves to the RIGHT. That’s the Coriolis effect in the Northern Hemisphere.'
      : 'Seen from above the South Pole, Earth spins the other way, so the path curves to the LEFT. That’s the Coriolis effect in the Southern Hemisphere.';
  }
  $('cLaunch').onclick = () => { if(!puck){ puck = {t:0, trail:[], pos:[0,0]}; $('cTxt').textContent = 'Watch the mark…'; } };
  $('cSpin').onclick = () => { spin = !spin; $('cSpin').setAttribute('aria-pressed', spin); $('cSpin').textContent = spin ? 'Earth spinning' : 'Earth stopped'; };
  $('cHem').onclick = () => { north = !north; trails = []; $('cHem').textContent = north ? 'Switch to Southern Hemisphere' : 'Switch to Northern Hemisphere'; $('cTxt').textContent = 'Hemisphere switched. Launch again.'; };
  $('cClear').onclick = () => { trails = []; };
  requestAnimationFrame(frame);

  // Belts
  const winds = ['Trade winds','Prevailing westerlies','Polar easterlies'];
  const air = ['Rises, making low pressure and rain','Sinks, making high pressure and dry weather'];
  const rows = [
    {l:'Surface wind at A (0°–30° N)', o:winds, a:0},
    {l:'Surface wind at B (30°–60° N)', o:winds, a:1},
    {l:'Surface wind at C (60°–90° N)', o:winds, a:2},
    {l:'At the equator (0°), air…', o:air, a:0},
    {l:'At about 30° N, air…', o:air, a:1}
  ];
  $('beltRows').innerHTML = rows.map((r,i) => `<div class="row"><span class="l" id="bl${i}">${r.l}</span><select id="bs${i}" aria-labelledby="bl${i}"><option value="">Choose…</option>${r.o.map((o,j)=>`<option value="${j}">${o}</option>`).join('')}</select><span class="mark" id="bm${i}"></span></div>`).join('');
  $('bCheck').onclick = () => {
    let n = 0;
    rows.forEach((r,i) => { const v = $('bs'+i).value; const ok = v !== '' && +v === r.a; if(ok) n++; $('bm'+i).textContent = v === '' ? '' : ok ? '✓' : '✗ try again'; $('bm'+i).style.color = ok ? 'var(--ok)' : 'var(--storm)'; });
    if(S.belts === null) { S.belts = n; save(); }
    $('bRes').textContent = n === 5 ? 'Your wind map is correct!' : `${n} of 5 correct.`;
  };
};
function cell(cx, cy, rx, ry, cw){
  const s = cw ? 1 : 0;
  const pts = cw
    ? `M${cx} ${cy+ry} A${rx} ${ry} 0 0 ${s} ${cx-rx} ${cy} A${rx} ${ry} 0 0 ${s} ${cx} ${cy-ry} A${rx} ${ry} 0 0 ${s} ${cx+rx} ${cy} A${rx} ${ry} 0 0 ${s} ${cx} ${cy+ry}`
    : `M${cx} ${cy+ry} A${rx} ${ry} 0 0 ${s} ${cx+rx} ${cy} A${rx} ${ry} 0 0 ${s} ${cx} ${cy-ry} A${rx} ${ry} 0 0 ${s} ${cx-rx} ${cy} A${rx} ${ry} 0 0 ${s} ${cx} ${cy+ry}`;
  return `<path d="${pts}" fill="none" stroke="var(--ocean)" stroke-width="3" marker-mid="url(#am)"/>`;
}

const Game = (() => {
  const W = 800, H = 450, LATMAX = 40;
  let cv, ctx, bg, st, round = 0, raf = null, keys = {up:false, dn:false}, last = 0;
  const y2 = lat => H - lat/LATMAX*H;
  const isLand = (x, lat) => (x < 70 && lat > 7) || (lat > 30.5 && x < 430) || (x > 765 && lat > 5) ||
    (Math.hypot((x-300)/38, (lat-20)/1.2) < 1) || (Math.hypot((x-380)/26, (lat-18.5)/1) < 1);
  const inGulf = (x, lat) => x > 70 && x < 430 && lat > 18 && lat < 30.5;
  function sst(x, lat){
    let s = 29.6 - Math.max(0, lat-16)*0.55;
    if(inGulf(x, lat)) s += 1.4;
    st.eddies.forEach(e => { const d = Math.hypot(x-e.x, y2(lat)-y2(e.lat)); if(d < e.r) s -= 3.2*(1-d/e.r); });
    return s;
  }
  function color(s){
    const t = Math.max(0, Math.min(1, (s-21)/10));
    const stops = [[30,90,170],[70,160,200],[240,200,90],[235,120,40],[200,40,50]];
    const f = t*(stops.length-1), i = Math.min(stops.length-2, Math.floor(f)), k = f - i;
    const c = stops[i].map((v,j) => Math.round(v + (stops[i+1][j]-v)*k));
    return `rgb(${c})`;
  }
  const rnd = (a,b) => a + Math.random()*(b-a);
  function setup(r){
    st = {x:735, lat:12, wind:25 + (S.game.boost||0), max:0, rot:0, t:0, trail:[], tt:0, over:false, msg:'',
      eddies: Array.from({length:1+r}, () => ({x:rnd(160,640), lat:rnd(9,21), r:rnd(40,62)})),
      shear: Array.from({length:1+r*1.5|0}, () => ({x:rnd(130,600), lat:rnd(10,24), w:rnd(80,130), h:rnd(3.5,5.5), vx:rnd(-6,6)})),
      drops: Array.from({length:12}, () => ({x:rnd(110,700), lat:rnd(7,24), got:false}))
    };
    st.drops = st.drops.filter(d => !isLand(d.x, d.lat));
    S.game.boost = 0; save();
    bg = document.createElement('canvas'); bg.width = W; bg.height = H; const b = bg.getContext('2d');
    for(let x=0; x<W; x+=8) for(let y=0; y<H; y+=8){
      const lat = (H-y-4)/H*LATMAX;
      b.fillStyle = isLand(x+4, lat) ? '#B7A27A' : color(sst(x+4, lat)); b.fillRect(x, y, 8, 8);
    }
    b.fillStyle = 'rgba(210,170,110,.28)'; b.fillRect(560, y2(30), 205, y2(19)-y2(30));
    b.strokeStyle = 'rgba(255,255,255,.75)'; b.setLineDash([6,6]); b.lineWidth = 1.5;
    [[5,'5° N: below this, too little Coriolis to spin'],[0,'Equator']].forEach(([lat,t]) => { b.beginPath(); b.moveTo(70,y2(lat)); b.lineTo(W,y2(lat)); b.stroke(); b.fillStyle='#fff'; b.font='13px Atkinson Hyperlegible, Verdana, sans-serif'; b.fillText(t, 80, y2(lat)-5); });
    b.setLineDash([]);
    b.fillStyle = '#1d2b20'; b.font = 'bold 15px Bricolage Grotesque, Verdana, sans-serif';
    b.fillText('North America', 140, y2(35)); b.fillText('Texas', 95, y2(31.5)); b.fillText('Mexico', 6, y2(22));
    b.save(); b.translate(790, y2(20)); b.rotate(-Math.PI/2); b.fillText('Africa', 0, 0); b.restore();
    b.fillStyle = '#fff'; b.font = '13px Atkinson Hyperlegible, Verdana, sans-serif';
    b.fillText('Gulf (extra warm)', 180, y2(25)); b.fillText('Dry dusty air', 600, y2(27)); b.fillText('Caribbean islands', 255, y2(17));
    b.fillText('Cooler water to the north', 470, y2(29));
  }
  function draw(){
    ctx.drawImage(bg, 0, 0);
    st.shear.forEach(s => {
      const y = y2(s.lat + s.h/2), h = y2(s.lat - s.h/2) - y;
      ctx.save(); ctx.beginPath(); ctx.rect(s.x, y, s.w, h); ctx.clip();
      ctx.fillStyle = 'rgba(80,20,60,.35)'; ctx.fillRect(s.x, y, s.w, h);
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 3;
      for(let k=-h; k<s.w; k+=14){ ctx.beginPath(); ctx.moveTo(s.x+k, y+h); ctx.lineTo(s.x+k+h, y); ctx.stroke(); }
      ctx.restore(); ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Atkinson Hyperlegible, Verdana, sans-serif'; ctx.fillText('wind shear', s.x+4, y-4);
    });
    st.drops.forEach(d => { if(d.got) return; const y = y2(d.lat);
      ctx.fillStyle = '#E6F7FF'; ctx.strokeStyle = '#0D5C7D'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(d.x, y-10); ctx.quadraticCurveTo(d.x+8, y+2, d.x, y+6); ctx.quadraticCurveTo(d.x-8, y+2, d.x, y-10); ctx.fill(); ctx.stroke(); });
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2; ctx.setLineDash([3,5]);
    ctx.beginPath(); st.trail.forEach(([x,l],i) => i ? ctx.lineTo(x, y2(l)) : ctx.moveTo(x, y2(l))); ctx.stroke(); ctx.setLineDash([]);
    const x = st.x, y = y2(st.lat), r = 12 + st.wind*0.16;
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.arc(0,0,r*1.1,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    for(let k=0;k<3;k++){ ctx.beginPath(); for(let t=0;t<=1.001;t+=.05){ const a = st.rot + k*2*Math.PI/3 + t*3.4; const rr = r*t; const px = Math.cos(a)*rr, py = Math.sin(a)*rr; t ? ctx.lineTo(px,py) : ctx.moveTo(px,py); } ctx.stroke(); }
    if(st.wind >= 74){ ctx.fillStyle = '#0a3a52'; ctx.beginPath(); ctx.arc(0,0,4+st.wind*.02,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
  }
  function hud(s){
    $('hW').textContent = Math.round(st.wind) + ' mph'; $('hC').textContent = category(st.wind);
    $('hT').textContent = isLand(st.x, st.lat) ? 'Over land' : `${s.toFixed(1)} °C`;
    $('hL').textContent = st.lat.toFixed(1) + '° N';
    $('status').textContent = st.msg;
  }
  function step(now){
    if(!cv.isConnected){ raf = null; return; }
    const dt = Math.min(.05, (now-last)/1000); last = now;
    st.t += dt;
    if(keys.up) st.lat += 2.6*dt; if(keys.dn) st.lat -= 2.6*dt;
    st.lat += (0.15 + st.lat*0.012)*dt;
    const vx = st.lat < 26 ? -15 : st.lat < 30 ? -5 : 9;
    st.x += vx*dt; st.rot -= dt*(1.2 + st.wind/35);
    st.shear.forEach(s => { s.x += s.vx*dt; if(s.x < 90 || s.x + s.w > 760) s.vx *= -1; });
    const s = sst(st.x, st.lat);
    let g, msg;
    const land = isLand(st.x, st.lat);
    const inShear = st.shear.some(z => st.x > z.x && st.x < z.x+z.w && Math.abs(st.lat - z.lat) < z.h/2);
    const dry = st.x > 560 && st.x < 765 && st.lat > 19 && st.lat < 30;
    if(land){ g = -20; msg = 'Over land: cut off from warm water, the storm is losing its fuel!'; }
    else {
      g = (s - 26.5)*1.25;
      msg = s >= 26.5 ? 'Warm water: evaporation and condensation are feeding the storm.' : 'Water is below 26.5 °C: not enough fuel. The storm is weakening.';
      if(st.lat < 5){ g = Math.min(g, 0) - 7; msg = 'Too close to the equator: the Coriolis effect is too weak to keep it spinning!'; }
      if(dry){ g -= 5; msg = 'Dry, dusty air is choking off cloud growth.'; }
      if(inShear){ g -= 15; msg = 'Wind shear is tilting and tearing the storm apart!'; }
    }
    st.wind = Math.max(0, Math.min(175, st.wind + g*dt));
    st.drops.forEach(d => { if(!d.got && Math.hypot(d.x-st.x, y2(d.lat)-y2(st.lat)) < 20){ d.got = true; st.wind += 5; msg = 'Moisture boost! More water vapor means more energy. +5 mph'; } });
    st.msg = msg; st.max = Math.max(st.max, st.wind);
    st.tt += dt; if(st.tt > .3){ st.tt = 0; st.trail.push([st.x, st.lat]); }
    st.lat = Math.max(0, Math.min(LATMAX, st.lat));
    draw(); hud(s);
    let end = null;
    if(st.wind < 12 && st.t > 3) end = 'Your storm fell apart and dissipated.';
    else if(land && st.x < 70) end = `Landfall! The storm came ashore at ${Math.round(st.wind)} mph.`;
    else if(land && st.lat > 30.5) end = `Landfall on the U.S. coast at ${Math.round(st.wind)} mph.`;
    else if(st.x > 790 || st.lat >= LATMAX - .2) end = 'The storm drifted out over cold northern water and lost its tropical fuel.';
    else if(st.t > 75) end = 'Time’s up! The forecast period ended.';
    if(end){ finish(end); return; }
    raf = requestAnimationFrame(step);
  }
  function finish(msg){
    raf = null; keys.up = keys.dn = false;
    const R = ROUNDS[round], peak = Math.round(st.max), success = peak >= R.target;
    const prev = S.game.rounds[round];
    if(!prev || peak > prev.peak) S.game.rounds[round] = {peak, success: success || (prev && prev.success)};
    save();
    const q = GAME_CHECKS[(round + Object.keys(S.game.rounds).length) % GAME_CHECKS.length];
    $('rpanel').innerHTML = `<h3>${success ? 'Mission accomplished!' : 'Mission not reached'}</h3>
      <p>${msg} Peak strength: <strong>${peak} mph (${category(peak)})</strong>. Goal was ${R.target} mph.</p>
      <p><strong>Forecaster check:</strong> ${q.q} Answer correctly to give your next storm a 10 mph head start.</p>
      <div class="opts" id="gq">${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}</div>
      <p class="fb" id="gqf" aria-live="polite"></p>
      <div class="controls" id="gnext"></div>`;
    $('gq').querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const j = +b.dataset.j; $('gq').querySelectorAll('.opt').forEach(x => x.disabled = true);
      if(j === q.a){ b.classList.add('right'); S.game.boost = 10; save(); $('gqf').className = 'fb ok'; $('gqf').textContent = 'Correct! Next storm starts 10 mph stronger.'; }
      else { b.classList.add('wrong'); $('gq').querySelectorAll('.opt')[q.a].classList.add('right'); $('gqf').className = 'fb no'; $('gqf').textContent = 'Not quite. The correct answer is highlighted.'; }
    });
    panelButtons();
  }
  function panelButtons(){
    const box = $('gnext') || $('rpanel');
    const html = ROUNDS.map((R,i) => {
      const unlockedR = i === 0 || S.game.rounds[i-1];
      const rec = S.game.rounds[i];
      return `<button class="btn ${!rec && unlockedR ? 'primary':''}" data-r="${i}" ${unlockedR?'':'disabled'}>${rec ? 'Replay' : 'Play'} round ${i+1}</button>`;
    }).join('');
    const table = `<div class="tablewrap"><table class="results"><tr><th>Round</th><th>Goal</th><th>Best peak</th><th>Result</th></tr>${ROUNDS.map((R,i)=>{const r=S.game.rounds[i];return `<tr><td>${i+1}</td><td>${R.target} mph</td><td>${r?r.peak+' mph':'–'}</td><td>${r?(r.success?'✓ Reached':'Not yet'):'–'}</td></tr>`;}).join('')}</table></div>`;
    if($('gnext')) { $('gnext').innerHTML = html; $('rpanel').insertAdjacentHTML('beforeend', table); }
    else $('rpanel').innerHTML = `<h3>Choose a round</h3>${table}<div class="controls">${html}</div>`;
    $('rpanel').querySelectorAll('[data-r]').forEach(b => b.onclick = () => start(+b.dataset.r));
  }
  function start(r){
    round = r; setup(r);
    $('rpanel').innerHTML = `<h3>Round ${r+1} of 3</h3><p>${ROUNDS[r].goal}${st.wind > 25 ? ' Your storm starts with a 10 mph head start.' : ''}</p><button class="btn" id="gquit">End round early</button>`;
    $('gquit').onclick = () => { if(raf){ cancelAnimationFrame(raf); finish('You ended the round early.'); } };
    cv.focus({preventScroll:true});
    last = performance.now(); if(raf) cancelAnimationFrame(raf); raf = requestAnimationFrame(step);
  }
  function init(){
    cv = $('gcanvas'); ctx = cv.getContext('2d'); setup(0); draw(); hud(sst(st.x, st.lat));
    $('status').textContent = 'Choose a round to begin.';
    panelButtons();
    const hold = (id, k) => { const b = $(id);
      b.onpointerdown = e => { e.preventDefault(); keys[k] = true; };
      ['pointerup','pointerleave','pointercancel'].forEach(ev => b.addEventListener(ev, () => keys[k] = false)); };
    hold('pUp','up'); hold('pDn','dn');
  }
  const key = (e, v) => {
    if(!cv || !cv.isConnected || !raf) return;
    const k = e.key.toLowerCase();
    if(k === 'arrowup' || k === 'w'){ keys.up = v; e.preventDefault(); }
    if(k === 'arrowdown' || k === 's'){ keys.dn = v; e.preventDefault(); }
  };
  window.addEventListener('keydown', e => key(e, true));
  window.addEventListener('keyup', e => key(e, false));
  return {init};
})();

/* ---------- Final ---------- */
function renderFinal(){
  const f = S.final;
  $('view').innerHTML = `
  <article>
    <p class="meta">Final challenge, all TEKS, about 20 minutes</p>
    <h2>Forecaster certification</h2>
    <p class="mission">Show what you know. You get one try on each question, so think it through before you submit.</p>
    <section id="fq">${FINAL_QS.map((q,i) => `
      <fieldset class="q"><legend>${i+1}. ${q.q}</legend>
        <div class="opts">${q.o.map((o,j) => `<button class="opt" data-i="${i}" data-j="${j}" aria-pressed="${f.ans[i]===j}">${o}</button>`).join('')}</div>
        <p class="fb" id="ff${i}"></p>
      </fieldset>`).join('')}</section>
    <div class="next"><button class="btn primary" id="fsub">Submit my answers</button><p id="fsm" aria-live="polite"></p></div>
    <section class="note" id="cerBox"></section>
    <section id="rep"></section>
  </article>`;
  const paint = () => {
    FINAL_QS.forEach((q,i) => {
      document.querySelectorAll(`.opt[data-i="${i}"]`).forEach(b => {
        const j = +b.dataset.j, picked = f.ans[i] === j;
        b.setAttribute('aria-pressed', picked);
        b.style.borderColor = picked && !f.submitted ? 'var(--ocean)' : '';
        b.style.background = picked && !f.submitted ? 'var(--ocean-soft)' : '';
        if(f.submitted){ b.disabled = true; b.classList.toggle('right', j === q.a); b.classList.toggle('wrong', picked && j !== q.a); }
      });
      if(f.submitted){ const ok = f.ans[i] === q.a; $('ff'+i).className = 'fb ' + (ok?'ok':'no'); $('ff'+i).textContent = ok ? 'Correct.' : 'Incorrect. The correct answer is highlighted in green.'; }
    });
    if(f.submitted){ $('fsub').style.display = 'none'; $('fsm').style.color = 'var(--ok)'; $('fsm').textContent = `Score: ${finalScore()} out of 10.`; showCER(); }
  };
  document.querySelectorAll('#fq .opt').forEach(b => b.onclick = () => { if(f.submitted) return; f.ans[+b.dataset.i] = +b.dataset.j; save(); paint(); });
  $('fsub').onclick = () => {
    const left = FINAL_QS.filter((q,i) => f.ans[i] === undefined).length;
    if(left){ $('fsm').textContent = `Answer ${left} more question${left>1?'s':''} before submitting.`; return; }
    f.submitted = true; save(); paint();
  };
  paint();
}
function finalScore(){ return FINAL_QS.filter((q,i) => S.final.ans[i] === q.a).length; }
function showCER(){
  $('cerBox').innerHTML = `<h3>Written explanation (claim, evidence, reasoning)</h3>
    <label for="cer">In 2017, Hurricane Harvey formed over warm tropical water, strengthened to Category 4, and dumped record rain on southeast Texas. Explain how energy from the <strong>Sun</strong>, the <strong>ocean</strong>, and the <strong>atmosphere</strong> worked together to build a storm like Harvey. Then explain why Harvey weakened after it moved inland. Include at least one global wind or the Coriolis effect in your answer.</label>
    <textarea id="cer" style="min-height:200px">${esc(S.cer||'')}</textarea><div class="count" id="ccnt"></div>
    <div class="next"><button class="btn primary" id="mkrep">Finish and build my report</button><p id="rmsg" aria-live="polite"></p></div>`;
  const t = $('cer'); const upd = () => { const n = t.value.trim().length; $('ccnt').textContent = n < 200 ? `Write at least 200 characters (${n} so far).` : 'Looks good.'; };
  t.oninput = () => { S.cer = t.value; save(); upd(); }; upd();
  $('mkrep').onclick = () => { if((S.cer||'').trim().length < 200){ $('rmsg').textContent = 'Your explanation needs at least 200 characters.'; return; } S.done.final = true; save(); renderTrack(); showReport(); };
  if(S.done.final) showReport();
}
function buildReport(){
  let firstTry = 0, total = 0;
  ['s1','s2','s3','s4','s5'].forEach(id => STATIONS[id].questions.forEach((q,i) => { total++; const r = (S.q[id]||{})[i]; if(r && r.correct && r.tries === 1) firstTry++; }));
  const sortFirst = Object.values(S.sortTries||{}).filter(Boolean).length;
  const lines = [
    'STORM ENGINE WEBQUEST REPORT (TEKS 8.10A, 8.10B, 8.10C)',
    `Student: ${S.name}${S.period ? '   Period: ' + S.period : ''}`,
    `Completed: ${new Date().toLocaleString()}`,
    '',
    `Final challenge: ${finalScore()} / 10`,
    `Station check questions correct on first try: ${firstTry} / ${total}`,
    `Weather vs. climate sort, first try: ${sortFirst} / 10`,
    `Wind belt map, first check: ${S.belts === null ? 'not checked' : S.belts + ' / 5'}`,
    `Storm Steer best peaks: ${ROUNDS.map((R,i) => { const r = S.game.rounds[i]; return `Round ${i+1}: ${r ? r.peak + ' mph' + (r.success ? ' (goal met)' : '') : '–'}`; }).join(';  ')}`,
    '',
    'FIELD NOTES'
  ];
  ['s1','s2','s3','s4','s5'].forEach(id => { lines.push(`Station ${STATIONS[id].n}: ${STATIONS[id].note}`); lines.push('  ' + (S.notes[id]||'').trim()); lines.push(''); });
  lines.push('Game debrief: ' + (S.gameNote||'').trim(), '', 'WRITTEN EXPLANATION (CER)', (S.cer||'').trim());
  return lines.join('\n');
}
function showReport(){
  const txt = buildReport();
  $('rep').innerHTML = `<div class="report">
    <h3>Mission complete, Forecaster ${esc(S.name)}!</h3>
    <p class="score">${finalScore()} / 10</p>
    <p>Copy your report and turn it in the way your teacher tells you (for example, paste it into your Google Classroom assignment).</p>
    <p><strong>Step 1:</strong> Save your work.</p>
    <div class="controls"><button class="btn primary" id="dl">Download my work</button><button class="btn" id="cp">Copy my report</button><span id="cpm" class="tag" aria-live="polite"></span></div>
    <p><strong>Step 2:</strong> After your work is downloaded or turned in, clear this Chromebook for the next student.</p>
    <div class="controls"><button class="btn" id="rsAsk">Reset for the next class</button></div>
    <div class="inline-confirm" id="rsBox"><span id="rsWarn"></span><button class="btn" id="rsYes">Erase my work and reset</button><button class="btn" id="rsNo">Not yet</button></div>
    <pre id="rtxt" tabindex="0">${esc(txt)}</pre>
    <textarea id="rta" style="position:absolute;left:-9999px" aria-hidden="true">${esc(txt)}</textarea>
  </div>`;
  let saved = false;
  const fname = 'Storm Engine - ' + (S.name || 'student').replace(/[^\w\- ]+/g, '').trim() + (S.period ? ' - Period ' + S.period.replace(/[^\w\- ]+/g, '') : '') + '.txt';
  $('dl').onclick = async () => {
    const dl = await dlReady;
    if(dl){
      try { await dl.save({filename: fname, data: txt}); saved = true; $('cpm').textContent = 'Downloaded! Find it in your Downloads folder.'; }
      catch(e){
        if(e && e.code === 'declined') $('cpm').textContent = 'Download canceled. Press the button again when you’re ready.';
        else if(e && e.code === 'rate_limited') $('cpm').textContent = 'A download box is already open. Finish that one first.';
        else $('cpm').textContent = 'Downloading isn’t available here. Use “Copy my report” and paste it into your assignment.';
      }
      return;
    }
    try {
      const url = URL.createObjectURL(new Blob([txt], {type:'text/plain'}));
      const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      saved = true; $('cpm').textContent = 'Downloaded! Find it in your Downloads folder.';
    } catch(e){ $('cpm').textContent = 'Downloading isn’t available here. Use “Copy my report” instead.'; }
  };
  $('rsAsk').onclick = () => {
    $('rsWarn').textContent = saved ? 'This erases all of your work from this Chromebook. Ready?' : 'You haven’t downloaded or copied your work yet! Resetting erases it for good. Reset anyway?';
    $('rsBox').classList.add('show');
  };
  $('rsNo').onclick = () => $('rsBox').classList.remove('show');
  $('rsYes').onclick = () => { S = fresh(); save(); render(); window.scrollTo({top:0}); };
  $('cp').onclick = async () => {
    try { await navigator.clipboard.writeText(txt); saved = true; $('cpm').textContent = 'Copied! Now paste it into your assignment.'; }
    catch(e){
      const ta = $('rta'); ta.select();
      try { document.execCommand('copy'); saved = true; $('cpm').textContent = 'Copied! Now paste it into your assignment.'; }
      catch(e2){ $('cpm').textContent = 'Copy is blocked here. Select the report text below and press Ctrl+C.'; }
    }
  };
}

render();
</script>
